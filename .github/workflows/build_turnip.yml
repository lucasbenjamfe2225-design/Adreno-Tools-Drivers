name: Build Turnip Android Variants

on:
  workflow_dispatch:
    inputs:
      mesa_commit:
        description: "Commit de Mesa (corto o completo). Vacio = ultimo main"
        required: false
        default: "22c08cc53bd0"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mesa_commit: ${{ steps.mesa.outputs.commit }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_name: ${{ steps.release.outputs.name }}
    steps:
      - name: Resolve Mesa commit
        id: mesa
        env:
          INPUT_COMMIT: ${{ github.event.inputs.mesa_commit }}
        run: |
          if [ -n "$INPUT_COMMIT" ]; then
            COMMIT="$INPUT_COMMIT"
          else
            COMMIT=$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git refs/heads/main | awk '{print $1}')
          fi
          test -n "$COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: release
        run: |
          DATE=$(date -u +'%Y.%m.%d')
          HUMAN_DATE=$(date -u +'%Y-%m-%d')
          echo "tag=v${DATE}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=Turnip R28 A650 Safe y Compat - ${HUMAN_DATE}" >> "$GITHUB_OUTPUT"

  prepare_release:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.resolve.outputs.release_name }}
          MESA_COMMIT: ${{ needs.resolve.outputs.mesa_commit }}
        run: |
          cat > release-notes.md <<EOF
          Turnip para Adreno 650 (SD870), Android/Bionic. Mesa: ${MESA_COMMIT}

          Safe: has_vk_memory_model=false (anti-crash Unreal), fix D32S8 intacto.
          Compat: Safe + revert D32S8 (parecido al driver A7xx anterior).

          Estado: en pruebas con Peanuts Native (Hogwarts Legacy, Sparking! ZERO).
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft --title "$RELEASE_NAME" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_NAME" --notes-file release-notes.md --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

  build:
    needs: [resolve, prepare_release]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
          include:
          - variant: a650
            artifact: Turnip-A650-Safe
            asset: Turnip_R28_A650_Safe.zip
          - variant: a650-compat
            artifact: Turnip-A650-Compat
            asset: Turnip_R28_A650_Compat.zip
          - variant: a650-compat-mem
            artifact: Turnip-A650-Compat-Mem
            asset: Turnip_R28_A650_Compat_Mem.zip
            

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            patchelf \
            unzip \
            flex \
            bison \
            git \
            perl \
            python3-pip \
            glslang-tools \
            curl \
            zip \
            patch \
            clang \
            lld \
            llvm
          pip3 install --break-system-packages meson mako

      - name: Build ${{ matrix.artifact }}
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_VERSION: ${{ github.run_number }}
          MESA_COMMIT: ${{ needs.resolve.outputs.mesa_commit }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Verify ZIP
        run: |
          find turnip_workdir -maxdepth 1 -type f -name "Turnip_*.zip" -print
          test "$(find turnip_workdir -maxdepth 1 -type f -name 'Turnip_*.zip' | wc -l)" -eq 1
          unzip -t turnip_workdir/Turnip_*.zip
          unzip -p turnip_workdir/Turnip_*.zip meta.json | python3 -m json.tool

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          ZIP="$(find turnip_workdir -maxdepth 1 -type f -name 'Turnip_*.zip' -print -quit)"
          test -f "$ZIP"
          cp "$ZIP" "$ASSET_NAME"
          gh release upload "$RELEASE_TAG" "$ASSET_NAME" --clobber --repo "$GITHUB_REPOSITORY"

  release:
    needs: [resolve, prepare_release, build]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          COUNT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          echo "Release assets: $COUNT"
          test "$COUNT" -eq 3

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --repo "$GITHUB_REPOSITORY"
